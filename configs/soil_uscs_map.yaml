# Soil-code to USCS / texture / Bekker-group engineering mapping.
#
# These are PROVISIONAL geotechnical inferences derived from Chinese soil type
# names recorded in the Nanjing soil catalogue (soil_nanjing.tif.vat.dbf).
# They are not a substitute for laboratory or field classification, and they are
# deliberately kept outside the code so every change is reviewable and hashed.
#
# source: Nanjing soil catalogue (soil_nanjing.tif.vat.dbf), soil type names
#         (VALUE -> 亚类名); inference follows the Phase-2 soil mapping note in
#         docs/history/code/20260917-0126-Phase 2-土壤USCS推定表与pilot索引重建.md
# issued: 2026-09-17
# updated: 2026-10-17 (moved out of gis_preprocessor.py without value changes)
#
# Field semantics:
#   texture     soil texture class used by the Bekker lookup ("Lo", "ClLo", ...)
#   uscs        USCS class used by the cone-index model; null = not applicable
#   bekker_soil Bekker empirical group ("loam" | "clayloam"); null = not applicable
#   passable    false for water / urban surfaces that must not carry vehicles

