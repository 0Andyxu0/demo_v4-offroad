version: static_gis_route_v2

soil:
  mode: categorical_drainage
  raster_path: data/inputs/soil/soil_nanjing.tif
  category_table_path: data/inputs/soil/soil_nanjing.tif.vat.dbf
  default_theta_v: null
  sensitivity_policy: shared_assumption
  shared_sensitivity: 1.0

hydrology:
  backend: grass_r_watershed
  flow_method: mfd
  upstream_complete: true
  analysis_resolution_m: null
  # QDX unaffected-valid TWI q05/q95 from GRASS 8.5 diagnostic run.
  # Operational drainage proxy, not field-validated soil moisture.
  mapping_t0: 4.387526936194684
  mapping_t1: 18.25971731959038
  unknown_drainage_range: [0.0, 1.0]

environment:
  model: surface_drainage_multiplier_v1
  pressure_basis: synthetic_scenario
  comparison_pressures: [0.0, 0.5, 1.0]
  request_pressures: [0.5, 1.0]
  unknown_surface_range: [0.0, 1.0]
  unknown_drainage_range: [0.0, 1.0]

weather:
  enabled: true
  provider: open-meteo
  endpoint: https://api.open-meteo.com/v1/forecast
  model: best_match
  timeout_s: 3.0
  ttl_s: 1800.0
  failure_ttl_s: 60.0
  max_age_s: 10800.0
  # Local 0-7 cm soil-moisture q05/q95 from the Open-Meteo archive at the study
  # site (2025-10-18..2026-10-17, grid 32.021/118.987). Single source of truth:
  # configs/scenes/qdx_moisture_calibration.json; the regression suite fails if
  # these two numbers drift from that file. Re-run scripts/calibrate_moisture.py
  # when the site or the mapping season changes.
  theta_dry: 0.159
  theta_wet: 0.424
  calibration_status: provisional_local_archive_q05_q95_20251018_20261017
  # Provisional reference for precipitation-based pressure fallback.
  api_reference_mm: 20.0

vehicle_geometry:
  reference_point: rear_axle_center
  width_m: 2.056
  wheelbase_m: 3.480
  front_overhang_m: 0.928
  rear_overhang_m: 0.940
  min_turn_radius_m: 5.116

geometry:
  simplify_tolerance_m: 0.05
  geometry_tolerance_m: 0.01
  map_error_m: 0.0
  arc_step_deg: 10.0
  max_arc_segments: 720

decision:
  detour_ratio: 0.15
  clearance_target_m: 0.0
  clearance_tolerance_m: 0.01
  switch_relative_improvement: 0.05
  candidate_limit: 24
  display_limit: 5
  require_independent_backup: false
