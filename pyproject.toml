[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "h3-offroad-planner"
version = "0.1.0"
description = "Single-vehicle H3 off-road RoutePlan and D* Lite planning workflow."
requires-python = ">=3.11"
dependencies = [
    "affine>=2.4",
    "geopandas>=1.0",
    "h3>=4.0",
    "numpy>=2.0",
    "pandas>=2.0",
    "pyarrow>=16.0",
    "PyYAML>=6.0",
    "rasterio>=1.3",
    "shapely>=2.0",
]

[project.scripts]
h3-offroad-planner = "h3_offroad_planner.cli:main"
h3-offroad-desktop = "h3_offroad_planner.desktop_client:run_desktop_client"
h3-offroad-console = "h3_offroad_planner.web_console:run_web_console"

[project.optional-dependencies]
dev = ["mypy>=1.0", "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]
desktop = ["PyQt5>=5.15", "PyQtWebEngine>=5.15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
h3_offroad_planner = ["web/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--basetemp=pytest_temp"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "affine",
    "geopandas",
    "h3",
    "pandas",
    "rasterio",
    "rasterio.*",
    "shapely",
    "shapely.*",
    "PyQt5",
    "PyQt5.*",
]
ignore_missing_imports = true
